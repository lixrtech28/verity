[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opportunity-intelligence-agent"
version = "0.1.0"
description = "Local-first evidence disciplined agent for company research and outreach preparation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2.10", "typer>=0.15"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]

[project.scripts]
opportunity-agent = "opportunity_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/opportunity_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
